name: build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: ${{ matrix.distribution || 'zulu' }}
        java-version: '11'
    - name: maven build
      run: mvn --batch-mode --errors --show-version --no-transfer-progress clean
        verify jacoco:report
    - name: code coverage
      uses: coverallsapp/github-action@v2
      with:
        format: jacoco
        files: fastexcel-writer/target/site/jacoco/jacoco.xml 
          fastexcel-reader/target/site/jacoco/jacoco.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
